version: '3'

tasks:
  default:
    desc: Run the simple debug workflow
    deps: [debug]

  prepare:
    desc: Run a prerequisite command
    cmds:
      - echo "[$TASK_HASH] Running $TASK_NAME"
      - |
        bash <<'BASH'
        seconds=$((RANDOM % 3 + 1))
        echo "Preparing the debug workflow (${seconds}s)"
        sleep "$seconds"
        BASH

  debug:
    desc: Run multiple commands after preparation succeeds
    deps: [prepare]
    cmds:
      - echo "[$TASK_HASH] Running $TASK_NAME"
      - |
        bash <<'BASH'
        seconds=$((RANDOM % 3 + 1))
        echo "Debug command 1 (${seconds}s)"
        sleep "$seconds"
        BASH
      - |
        bash <<'BASH'
        seconds=$((RANDOM % 3 + 1))
        echo "Debug command 2 (${seconds}s)"
        sleep "$seconds"
        BASH
