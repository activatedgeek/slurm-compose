name: evaluation

vars:
  MODEL: qwen3
  NODES: 1

sbatch:
  nodes: ${{ vars.NODES }}
  ntasks_per_node: 2
  cpus_per_task: 4
  gpus_per_node: 1
  mem: 32G
  partition: gpu
  time: "01:00:00"
  max_restarts: 3
  completion:
    mode: step
    step: evaluate

steps:
  prepare:
    command: >-
      python /shared/project/prepare.py

  model:
    command: ["/shared/project/start-model.sh", "--model", "${{ vars.MODEL }}"]
    kwargs:
      container_image: /shared/images/model.sqsh
      nodes: 1
      ntasks_per_node: 1
      cpus_per_task: 4
      gpus_per_node: 1
      mem: 24G
    depends_on:
      prepare:
        condition: completed_successfully
  evaluate:
    command: "python /shared/project/evaluate.py"
    kwargs:
      nodes: 1
      ntasks_per_node: 1
      cpus_per_task: 4
      gpus_per_node: 0
      mem: 8G
    environment:
      DATASET: /shared/data/evaluation
    depends_on:
      model:
        condition: completed_successfully
